async function wx(m){const o=$('#wx');o.textContent='กำลังโหลด…';try{let la=25.03,lo=121.56;if(m=='gps'){const p=await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j,{timeout:10000}));la=p.coords.latitude;lo=p.coords.longitude}
const j=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`)).json();
o.innerHTML=`<b>ตอนนี้ ${Math.round(j.current.temperature_2m)}°C</b> ${wm(j.current.weather_code)}`+j.daily.time.map((t,i)=>`<div class="wr"><span>${t.slice(5)}</span><span>${wm(j.daily.weather_code[i])}</span><span>${Math.round(j.daily.temperature_2m_min[i])}–${Math.round(j.daily.temperature_2m_max[i])}°C</span><span>☔${j.daily.precipitation_probability_max[i]??'-'}%</span></div>`).join('')}
catch(e){o.innerHTML='โหลดไม่ได้ (ต้องมีเน็ต/อนุญาตตำแหน่ง หรือหน้านี้ถูกบล็อก) · <a style="color:var(--g)" target="_blank" href="https://www.google.com/search?q=weather+Taipei">ดูอากาศใน Google</a>'}}
function cv(src){const r=+S.rate||1,a=$('#twd'),b=$('#thb');if(!a)return;if(src=='b')a.value=b.value?+(b.value/r).toFixed(2):'';else b.value=a.value?+(a.value*r).toFixed(2):''}
const tools=()=>`<div class="card"><h3>🌤 อากาศ</h3><button class="ad" data-a="wx" data-v="gps">📍 ตามตำแหน่ง GPS</button><button class="ad" data-a="wx" data-v="tp">ไทเป</button><div id="wx" style="margin-top:8px" class="m">กดปุ่มเพื่อดูพยากรณ์ 7 วัน</div></div>
<div class="card"><h3>💱 TWD ↔ THB</h3><div class="m">เรท: 1 TWD = (บาท) แก้ให้ตรงกับเรทจริง</div><input class="i" type="number" step="0.01" data-p="rate" value="${S.rate}"><input class="i" id="twd" type="number" placeholder="NT$ (ดอลลาร์ไต้หวัน)"><input class="i" id="thb" type="number" placeholder="บาท"></div>`
+P.map(([n,a])=>`<div class="card"><h3>${n}</h3>`+a.map(([z,p,t])=>`<div class="ph"><div><div class="zh">${esc(z)}</div><div class="py">${esc(p)}</div><div class="m">${esc(t)}</div></div><button class="x" data-a="say" data-v="${esc(z)}">🔊</button></div>`).join('')+'</div>').join('');
const docs=()=>`<div class="card"><h3>⏰ เตือนเวลาสำคัญ</h3><div class="m">กด “เตือน” เพื่อเพิ่มลง Google Calendar ของคุณ แล้วตั้งการแจ้งเตือนได้ตามต้องการ</div>`+S.keys.map((x,i)=>`<div class="st"><div class="b">`+(edit?inp(`keys.${i}.t`,x.t,'เรื่อง')+inp(`keys.${i}.d`,x.d,'','type="date"')+inp(`keys.${i}.tm`,x.tm,'','type="time"')+`<button class="x" data-a="del" data-p="keys" data-i="${i}">🗑 ลบ</button>`:`<div><span class="tm">${x.d.slice(5)} ${x.tm}</span> ${esc(x.t)}</div><div class="m">${x.z=='Asia/Bangkok'?'เวลาไทย':'เวลาไต้หวัน'}</div><div class="lk"><a target="_blank" href="${gcal(x.t,x.d,x.tm,x.z)}">⏰ เตือนใน Calendar</a></div>`)+'</div></div>').join('')+`<button class="ad" data-a="add" data-p="keys" data-k="key">+ เพิ่มเตือน</button></div>
<div class="card"><h3>📄 เอกสารสำคัญ</h3><div class="m">เก็บในเครื่องนี้เท่านั้น (ไม่ส่งออกไปไหน)</div>`+S.docs.map((x,i)=>`<div class="st"><div class="b">`+(edit?inp(`docs.${i}.l`,x.l,'หัวข้อ')+inp(`docs.${i}.v`,x.v,'รายละเอียด')+`<button class="x" data-a="del" data-p="docs" data-i="${i}">🗑 ลบ</button>`:`<div class="m">${esc(x.l)}</div><div>${esc(x.v)||'<span class="m">— แตะ “แก้ไข” เพื่อกรอก —</span>'}</div>`)+'</div></div>').join('')+`<button class="ad" data-a="add" data-p="docs" data-k="doc">+ เพิ่มเอกสาร</button></div>
<div class="card"><h3>💾 สำรองข้อมูล</h3><button class="x" data-a="cp">คัดลอกข้อมูลสำรอง</button><button class="x" data-a="im">นำเข้า</button><button class="x" data-a="rs">รีเซ็ตทั้งหมด</button></div>`;
const snk=()=>`<div class="card"><h3>🍡 ขนม / ของฝากที่เจอรีวิว</h3><div class="m">อัปโหลดรูปไว้ เผื่อเจอจะได้ซื้อ · แตะรูปเพื่อขยาย</div><label class="ad" style="display:inline-block">📷 เพิ่มรูป<input type="file" accept="image/*" multiple hidden id="sf"></label><div class="gr">`+S.snacks.map((x,i)=>`<div class="sn"><img src="${x.img}" data-a="zoom" data-i="${i}" alt=""><label class="sc"><input type="checkbox" data-p="snacks.${i}.d" ${x.d?'checked':''}> ${x.d?'ซื้อแล้ว ✅':'ยังไม่ซื้อ'}</label>${inp(`snacks.${i}.n`,x.n,'ชื่อ/ร้าน/ราคา')}<button class="x" data-a="del" data-p="snacks" data-i="${i}">🗑 ลบ</button></div>`).join('')+'</div></div>';
const rs=f=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(f)});
document.addEventListener('change',async e=>{if(e.target.id!='sf')return;for(const f of e.target.files){try{S.snacks.push({img:await rs(f),n:'',d:0});localStorage.setItem(K,JSON.stringify(S))}catch(x){S.snacks.pop();alert('เพิ่มรูปไม่ได้ (พื้นที่เก็บเต็มหรือไฟล์ไม่รองรับ)');break}}R()});
function R(){$('#app').innerHTML={plan,lists,food,tools,docs}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==tab));$('#ed').textContent=edit?'✔ เสร็จ':'✏️ แก้ไข';cv('a');tick()}
function tick(){const ms=new Date('2026-12-23T08:15:00+07:00')-Date.now();$('#cd').textContent=ms<=0?'ออกเดินทางแล้ว ✈️':`${Math.floor(ms/864e5)} วัน ${Math.floor(ms%864e5/36e5)} ชม. ${Math.floor(ms%36e5/6e4)} น.`}
document.addEventListener('input',e=>{const t=e.target;if(t.type=='checkbox')return;if(t.dataset.p){sp(t.dataset.p,t.type=='number'?+t.value:t.value);if(t.dataset.p=='rate')cv('a')}else if(t.id=='twd')cv('a');else if(t.id=='thb')cv('b')});
document.addEventListener('change',e=>{const t=e.target;if(t.type=='checkbox'&&t.dataset.p){sp(t.dataset.p,t.checked?1:0);R()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,p=b.dataset.p,i=+b.dataset.i;
if(a=='tab'){tab=b.dataset.v;scrollTo(0,0)}else if(a=='day')day=i;else if(a=='ed')edit=!edit;
else if(a=='add'){gp(p).push(cp(T[b.dataset.k]));edit=true;save()}
else if(a=='del'){if(!confirm('ลบรายการนี้?'))return;gp(p).splice(i,1);save()}
else if(a=='zoom'){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:9';o.innerHTML='<img src="'+S.snacks[i].img+'" style="max-width:96%;max-height:90%">';o.onclick=()=>o.remove();document.body.append(o);return}
else if(a=='wx'){wx(b.dataset.v);return}
else if(a=='say'){try{const u=new SpeechSynthesisUtterance(b.dataset.v);u.lang='zh-TW';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(x){}return}
else if(a=='cp'){const j=JSON.stringify(S);navigator.clipboard.writeText(j).then(()=>alert('คัดลอกแล้ว วางเก็บไว้ในโน้ต/แชตของคุณ')).catch(()=>prompt('คัดลอกข้อความนี้',j));return}
else if(a=='im'){const v=prompt('วางข้อมูลสำรอง');if(!v)return;try{S=Object.assign(cp(D),JSON.parse(v));save()}catch(x){alert('ข้อมูลไม่ถูกต้อง');return}}
else if(a=='rs'){if(!confirm('ล้างการแก้ไขและติ๊กทั้งหมด?'))return;S=cp(D);save()}
R()});
setInterval(tick,3e4);R();
</script></body></html>
