        const p = `${pre}.stops.${i}`;
        h += `<div class="st"><input type="checkbox" data-p="${p}.d" ${x.d ? 'checked' : ''} ${!isOwner ? 'disabled' : ''}><div class="b">` +
        (isOwner && edit ? inp(p + '.t', x.t, 'เวลา เช่น 09:30') + inp(p + '.n', x.n, 'สถานที่') + inp(p + '.m', x.m, 'การเดินทาง/โน้ต') + inp(p + '.q', x.q, 'คำค้นใน Google Maps') + `<button class="x" data-a="del" data-p="${pre}.stops" data-i="${i}">🗑 ลบ</button>`
        : `<div class="${x.d ? 'dn' : ''}"><span class="tm">${esc(x.t)}</span> <b>${esc(x.n)}</b></div>${x.m ? `<div class="m">🚆 ${esc(x.m)}</div>` : ''}<div class="lk"><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${enc(x.q || x.n)}">📍แผนที่</a><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${enc(x.q || x.n)}&travelmode=transit">🧭นำทาง</a>${tmOk(x.t) && d.date ? `<a target="_blank" href="${gcal(x.n, d.date, x.t, 'Asia/Taipei', x.m)}">⏰เตือน</a>` : ''}</div>`) + '</div></div>';
      });
      return h + (isOwner && edit ? `<button class="ad" data-a="add" data-p="${pre}.stops" data-k="stop">+ เพิ่มสถานที่</button>` : '') + '</div>';
    }

    const lst = p => gp(p).map((x, i) => `<div class="r"><input type="checkbox" data-p="${p}.${i}.d" ${x.d ? 'checked' : ''} ${!isOwner ? 'disabled' : ''}>` + (isOwner && edit ? inp(p + '.' + i + '.t', x.t, 'รายการ') + `<button class="x" data-a="del" data-p="${p}" data-i="${i}">✕</button>` : `<span class="${x.d ? 'dn' : ''}">${esc(x.t)}</span>`) + '</div>').join('') + (isOwner && edit ? `<button class="ad" data-a="add" data-p="${p}" data-k="it">+ เพิ่ม</button>` : '');
    const gp = p => p.split('.').reduce((o, k) => o[k], S);

    const lists = () => `<div class="card"><h3>✈️ เช็กลิสต์ก่อนบิน</h3>${lst('c1')}</div><div class="card"><h3>🏠 เช็กลิสต์ก่อนกลับ</h3>${lst('c2')}</div><div class="card"><h3>🛒 ของที่ต้องซื้อ</h3>${lst('shop')}</div><div class="card"><h3>📝 โน้ต</h3>${isOwner ? `<textarea class="i" data-p="notes" placeholder="จดอะไรก็ได้">${esc(S.notes)}</textarea>` : `<div>${esc(S.notes) || '<span class="m">— ไม่มีโน้ต —</span>'}</div>`}</div>`;

    const food = () => `<div class="card"><h3>🍜 ร้านอาหารที่อยากกิน</h3><div class="m">ร้านอาหารทั้งหมดในทริป</div>` + S.food.map((x, i) => `<div class="st"><input type="checkbox" data-p="food.${i}.d" ${x.d ? 'checked' : ''} ${!isOwner ? 'disabled' : ''}><div class="b">` + (isOwner && edit ? inp(`food.${i}.n`, x.n, 'ชื่อร้าน') + inp(`food.${i}.a`, x.a, 'ย่าน/เมนู/โน้ต') + `<button class="x" data-a="del" data-p="food" data-i="${i}">🗑 ลบ</button>` : `<div class="${x.d ? 'dn' : ''}"><b>${esc(x.n)}</b></div><div class="m">${esc(x.a)}</div><div class="lk"><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${enc(x.n + ' ' + x.a)}">📍แผนที่</a></div>`) + '</div></div>').join('') + (isOwner && edit ? `<button class="ad" data-a="add" data-p="food" data-k="food">+ เพิ่มร้าน</button>` : '') + `</div>` + snk();

    function wm(c) { return c == 0 ? '☀️ แจ่มใส' : c < 4 ? '⛅ มีเมฆ' : c < 50 ? '🌫 หมอก' : c < 70 ? '🌧 ฝน' : c < 80 ? '❄️ หิมะ' : c < 90 ? '🌦 ฝนซู่' : '⛈ พายุ'; }
    async function wx(m) {
      const o = $('#wx'); o.textContent = 'กำลังโหลด…';
      try {
        let la = 25.03, lo = 121.56;
        if (m == 'gps') {
          const p = await new Promise((r, j) => navigator.geolocation.getCurrentPosition(r, j, { timeout: 10000 }));
          la = p.coords.latitude; lo = p.coords.longitude;
        }
        const j = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`)).json();
        o.innerHTML = `<b>ตอนนี้ ${Math.round(j.current.temperature_2m)}°C</b> ${wm(j.current.weather_code)}` + j.daily.time.map((t, i) => `<div class="wr"><span>${t.slice(5)}</span><span>${wm(j.daily.weather_code[i])}</span><span>${Math.round(j.daily.temperature_2m_min[i])}–${Math.round(j.daily.temperature_2m_max[i])}°C</span><span>☔${j.daily.precipitation_probability_max[i] ?? '-'}%</span></div>`).join('');
      } catch (e) { o.innerHTML = 'โหลดไม่ได้'; }
    }

    function cv(src) {
      const r = +S.rate || 1, a = $('#twd'), b = $('#thb');
      if (!a) return;
      if (src == 'b') a.value = b.value ? +(b.value / r).toFixed(2) : '';
      else b.value = a.value ? +(a.value * r).toFixed(2) : '';
    }

    const tools = () => `<div class="card"><h3>🌤 อากาศ</h3><button class="ad" data-a="wx" data-v="gps">📍 ตามตำแหน่ง GPS</button><button class="ad" data-a="wx" data-v="tp">ไทเป</button><div id="wx" style="margin-top:8px" class="m">กดปุ่มเพื่อดูพยากรณ์ 7 วัน</div></div>
    <div class="card"><h3>💱 TWD ↔ THB</h3><div class="m">เรท: 1 TWD = ${S.rate} บาท</div>${isOwner ? `<input class="i" type="number" step="0.01" data-p="rate" value="${S.rate}">` : ''}<input class="i" id="twd" type="number" placeholder="NT$ (ดอลลาร์ไต้หวัน)"><input class="i" id="thb" type="number" placeholder="บาท"></div>` +
    P.map(([n, a]) => `<div class="card"><h3>${n}</h3>` + a.map(([z, p, t]) => `<div class="ph"><div><div class="zh">${esc(z)}</div><div class="py">${esc(p)}</div><div class="m">${esc(t)}</div></div><button class="x" data-a="say" data-v="${esc(z)}">🔊</button></div>`).join('') + '</div>').join('');

    const docs = () => `<div class="card"><h3>⏰ เตือนเวลาสำคัญ</h3><div class="m">เวลาสำคัญในทริป</div>` + S.keys.map((x, i) => `<div class="st"><div class="b">` + (isOwner && edit ? inp(`keys.${i}.t`, x.t, 'เรื่อง') + inp(`keys.${i}.d`, x.d, '', 'type="date"') + inp(`keys.${i}.tm`, x.tm, '', 'type="time"') + `<button class="x" data-a="del" data-p="keys" data-i="${i}">🗑 ลบ</button>` : `<div><span class="tm">${x.d.slice(5)} ${x.tm}</span> ${esc(x.t)}</div><div class="m">${x.z == 'Asia/Bangkok' ? 'เวลาไทย' : 'เวลาไต้หวัน'}</div><div class="lk"><a target="_blank" href="${gcal(x.t, x.d, x.tm, x.z)}">⏰ เตือนใน Calendar</a></div>`) + '</div></div>').join('') + (isOwner && edit ? `<button class="ad" data-a="add" data-p="keys" data-k="key">+ เพิ่มเตือน</button>` : '') + `</div>
    <div class="card"><h3>📄 เอกสารสำคัญ</h3><div class="m">${isOwner ? 'ข้อมูลส่วนตัวของคุณ' : 'แสดงเฉพาะเจ้าของทริป'}</div>` + (isOwner ? privS.docs.map((x, i) => `<div class="st"><div class="b">${inp(`privDocs.${i}.l`, x.l, 'หัวข้อ')}${inp(`privDocs.${i}.v`, x.v, 'รายละเอียด')}<button class="x" data-a="delPriv" data-i="${i}">🗑 ลบ</button></div></div>`).join('') + `<button class="ad" data-a="addPriv">+ เพิ่มเอกสาร</button>` : `<div class="m">คุณไม่มีสิทธิ์ดูเอกสารส่วนตัวนี้</div>`) + `</div>` + (isOwner ? `<div class="card"><h3>💾 จัดการระบบ</h3><button class="x" data-a="logout">🚪 ออกจากระบบเจ้าของ</button></div>` : ``);

    const snk = () => `<div class="card"><h3>🍡 ขนม / ของฝากที่เจอรีวิว</h3><div class="m">แตะรูปเพื่อขยาย</div>` + (isOwner ? `<label class="ad" style="display:inline-block">📷 เพิ่มรูป<input type="file" accept="image/*" multiple hidden id="sf"></label>` : ``) + `<div class="gr">` + S.snacks.map((x, i) => `<div class="sn"><img src="${x.img}" data-a="zoom" data-i="${i}" alt=""><label class="sc"><input type="checkbox" data-p="snacks.${i}.d" ${x.d ? 'checked' : ''} ${!isOwner ? 'disabled' : ''}> ${x.d ? 'ซื้อแล้ว ✅' : 'ยังไม่ซื้อ'}</label>${isOwner ? inp(`snacks.${i}.n`, x.n, 'ชื่อ/ร้าน/ราคา') : `<div class="m">${esc(x.n)}</div>`}${isOwner ? `<button class="x" data-a="del" data-p="snacks" data-i="${i}">🗑 ลบ</button>` : ''}</div>`).join('') + '</div></div>';

    async function uploadFiles(files) {
      if (!sb) { alert('ยังเชื่อมต่อ Supabase ไม่ได้'); return; }
      for (const f of files) {
        try {
          const fn = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.jpg`;
          const { error } = await sb.storage.from('trip-photos').upload(fn, f);
          if (error) throw error;
          const { data: pubUrl } = sb.storage.from('trip-photos').getPublicUrl(fn);
          S.snacks.push({ img: pubUrl.publicUrl, n: '', d: 0 });
          saveRemote();
        } catch (e) { alert('อัปโหลดรูปไม่สำเร็จ'); }
      }
      R();
    }

    document.addEventListener('change', async e => {
      if (e.target.id != 'sf') return;
      await uploadFiles(e.target.files);
    });

    function R() {
      const view = {plan, lists, food, tools, docs}[tab];
      $('#app').innerHTML = view ? view() : plan();
      document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v == tab));
      const edBtn = $('#ed'), authBtn = $('#auth-btn');
      if (isOwner) {
        edBtn.style.display = 'inline-block';
        edBtn.textContent = edit ? '✔ เสร็จ' : '✏️ แก้ไข';
        authBtn.textContent = '🔒 เจ้าของระบบ';
      } else {
        edBtn.style.display = 'none';
        authBtn.textContent = '🔐 ล็อกอิน';
      }
      cv('a');
      tick();
    }

    function tick() {
      const ms = new Date('2026-12-23T08:15:00+07:00') - Date.now();
      const cdEl = $('#cd');
      if (cdEl) {
        cdEl.textContent = ms <= 0 ? 'ออกเดินทางแล้ว ✈️' : `${Math.floor(ms / 864e5)} วัน ${Math.floor(ms % 864e5 / 36e5)} ชม. ${Math.floor(ms % 36e5 / 6e4)} น.`;
      }
    }

    document.addEventListener('input', e => {
      const t = e.target;
      if (!isOwner || t.type == 'checkbox') return;
      if (t.dataset.p && t.dataset.p.startsWith('privDocs.')) {
        const [, i, k] = t.dataset.p.split('.');
        privS.docs[i][k] = t.value;
        savePrivateRemote();
      } else if (t.dataset.p) {
        sp(t.dataset.p, t.type == 'number' ? +t.value : t.value);
        saveRemote();
        if (t.dataset.p == 'rate') cv('a');
      } else if (t.dataset.priv) {
        const i = t.dataset.i;
        privS.docs[i][t.dataset.k] = t.value;
        savePrivateRemote();
      } else if (t.id == 'twd') cv('a');
      else if (t.id == 'thb') cv('b');
    });

    function sp(p, v) {
      const a = p.split('.'), l = a.pop();
      a.reduce((o, k) => o[k], S)[l] = v;
    }

    document.addEventListener('change', e => {
      const t = e.target;
      if (t.type == 'checkbox' && t.dataset.p) {
        if (!isOwner) return;
        sp(t.dataset.p, t.checked ? 1 : 0);
        saveRemote();
        R();
      }
    });

    document.addEventListener('click', async e => {
      const b = e.target.closest('[data-a]');
      if (b) {
        const a = b.dataset.a, p = b.dataset.p, i = +b.dataset.i;
        if (a == 'tab') { tab = b.dataset.v; scrollTo(0, 0); }
        else if (a == 'day') day = i;
        else if (a == 'ed') edit = !edit;
        else if (a == 'add') { if (!isOwner) return; gp(p).push(cp(T[b.dataset.k])); edit = true; saveRemote(); }
        else if (a == 'del') { if (!isOwner) return; if (!confirm('ลบรายการนี้?')) return; gp(p).splice(i, 1); saveRemote(); }
        else if (a == 'zoom') {
          const o = document.createElement('div');
          o.style.cssText = 'position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:9';
          o.innerHTML = '<img src="' + b.src + '" style="max-width:96%;max-height:90%">';
          o.onclick = () => o.remove();
          document.body.append(o);
          return;
        }
        else if (a == 'wx') { wx(b.dataset.v); return; }
        else if (a == 'say') { try { const u = new SpeechSynthesisUtterance(b.dataset.v); u.lang = 'zh-TW'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (x) {} return; }
        else if (a == 'logout') { if (sb) await sb.auth.signOut(); isOwner = false; edit = false; S = cp(D); R(); alert('ออกจากระบบแล้ว'); return; }
        else if (a == 'addPriv') { privS.docs.push({ l: '', v: '' }); savePrivateRemote(); }
        else if (a == 'delPriv') { privS.docs.splice(i, 1); savePrivateRemote(); }
        R();
      }
      
      if (e.target.id == 'auth-btn') {
        if (isOwner) { alert('คุณอยู่ในฐานะเจ้าของระบบอยู่แล้ว'); return; }
        if (!sb) { alert('ยังเชื่อมต่อ Supabase ไม่ได้ (ดู Console)'); return; }
        const email = prompt('ใส่อีเมลเจ้าของระบบ:');
        if (!email) return;
        const password = prompt('ใส่รหัสผ่าน:');
        if (!password) return;
        
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { alert('ล็อกอินไม่สำเร็จ: ' + error.message); return; }
        
        isOwner = true;
        await loadPrivateData();
        await loadData();
        alert('ล็อกอินสำเร็จ! คุณสามารถแก้ไขข้อมูลได้แล้ว');
      }
    });

    async function initApp() {
      R(); // แสดงหน้าทันทีด้วยข้อมูลตั้งต้น ไม่ต้องรอเน็ต/Supabase
      try {
        if (sb) {
          const { data: { session } } = await withTimeout(sb.auth.getSession());
          if (session) { isOwner = true; await loadPrivateData(); }
        }
      } catch (e) { console.error(e); }
      await loadData();
    }

    setInterval(tick, 3e4);
    initApp();
  </script>
</body>
</html>
